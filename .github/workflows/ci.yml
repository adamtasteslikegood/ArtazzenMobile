name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and format
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift tooling
        run: brew install swiftlint swift-format
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: swift-format
        run: swift-format lint --recursive --strict --configuration .swift-format Sources Tests

  test:
    name: Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test package
        run: xcodebuild -scheme ArtazzenMobile-Package -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' test

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: xcodebuild -scheme ArtazzenMobile-Package -destination 'generic/platform=iOS' build
