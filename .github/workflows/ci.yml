name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and format
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift tooling (pinned versions)
        run: |
          # Pin exact tool versions. Unpinned `brew install` drifts as new
          # releases enable default-on SwiftLint rules (e.g.
          # legacy_swiftui_aspect_ratio in 0.65.0) and break the strict gate.
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-bin
          echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only applies to later steps, so export PATH here too
          # for the in-step version checks below.
          export PATH="/tmp/swiftlint-bin:$PATH"
          # Homebrew 5.x rejects formulae outside a tap, so pull the pinned
          # swift-format bottle (603.0.0, arm64 sonoma) directly from ghcr.io.
          # The blob digest is the bottle sha256 from homebrew-core commit
          # 514328ad9ca0ff787a372efac065d3ad5aa87c9c.
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:homebrew/core/swift-format:pull&service=ghcr.io" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -fsSL -H "Authorization: Bearer $TOKEN" -o /tmp/swift-format-bottle.tar.gz \
            "https://ghcr.io/v2/homebrew/core/swift-format/blobs/sha256:18229678d294ef981b9ecff8b943987a8088c484403915ba4c3c219fbc50dc43"
          tar -xzf /tmp/swift-format-bottle.tar.gz -C /tmp
          echo "/tmp/swift-format/603.0.0/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/swift-format/603.0.0/bin:$PATH"
          swiftlint version
          swift-format --version
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: swift-format
        run: |
          if ! swift-format lint --recursive --strict --configuration .swift-format Sources Tests; then
            echo "::warning::swift-format found pre-existing style differences; new Swift changes should be formatted before merge."
          fi

  test:
    name: Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test package
        run: xcodebuild -scheme ArtazzenMobile -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' test

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: xcodebuild -scheme ArtazzenMobile -destination 'generic/platform=iOS' build
